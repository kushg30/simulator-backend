# ============================================================================
# Application configuration — contains NO secrets, safe to commit.
#
# Every value can be overridden by an environment variable (the ${VAR:default}
# syntax). In production (Render + Neon) set the datasource and token via env
# vars; locally it falls back to a Postgres on 127.0.0.1, which pg_hba trusts
# without a password, so no local secret is needed.
# ============================================================================

# -------------------------
# Datasource (override in prod via SPRING_DATASOURCE_* env vars)
# -------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/simulator_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:simulator_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# -------------------------
# Connection pool (HikariCP)
# -------------------------
# A whole cohort polls every 3s, so many short DB calls land at once. The default pool of 10 could
# saturate under a class and surface as "failed to fetch" in the browser. These sizes assume Neon's
# POOLED endpoint (host ...-pooler.<region>.aws.neon.tech) — use that URL in SPRING_DATASOURCE_URL so
# the app's connections are multiplexed and never exhaust Neon's per-compute limit. Fast connection
# timeout so a blip fails quickly and the client retries, rather than hanging 30s. max-lifetime is
# kept under Neon's idle window and keepalive stops idle connections being dropped mid-session.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:280000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:120000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:120000}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is managed by the SQL in src/main/resources/db/migration (applied by
# hand / at deploy). `update` only lets Hibernate add columns for the JPA
# entities (team, participant); it never drops anything.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# Simulations
# -------------------------
# Simulation a team is assigned to when none is specified (Simulation 1, ANP Phoenix).
simulator.default-simulation-id=${SIMULATOR_DEFAULT_SIMULATION_ID:475db739-0708-48d4-b4db-5a23f1da50d9}

# Simulator 2: where round submissions are stored (retained for faculty review,
# never parsed). On an ephemeral host set this to a mounted disk to keep files.
sim2.upload-dir=${SIM2_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:50MB}

# -------------------------
# Faculty control layer
# -------------------------
# Shared facilitator token, required on every /api/faculty/* route. If blank the
# faculty endpoints refuse ALL requests (fail closed). There is deliberately NO
# default here: a token must be supplied via the FACULTY_ACCESS_TOKEN env var, so
# no usable credential ever ships in source control.
faculty.access-token=${FACULTY_ACCESS_TOKEN:}

# -------------------------
# Logging (console only; the host captures stdout)
# -------------------------
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.example.simulator=INFO
